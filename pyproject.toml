[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-flow"
version = "0.1.0"
description = "PDF to Markdown converter for chip manuals and datasheets"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    { name = "OCR Flow Team" }
]
dependencies = [
    "PyMuPDF>=1.23.0",
    "requests>=2.28.0",
    "urllib3>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "tomli>=2.0.0",
]

[project.scripts]
ocr-flow = "ocr_flow.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ocr_flow*"]
